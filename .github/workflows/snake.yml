name: generate the contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: chalawdotcom
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_dots=#ebe9f6,#c7c2f2,#9d94ea,#6d61e6,#5047eb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#1f1e2e,#3a3466,#5a4fb0,#7b6fe0,#a89dff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
