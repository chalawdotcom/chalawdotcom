# Renders the two stats cards as static SVGs committed under profile/, the same
# pattern the snake uses. Why not the public github-readme-stats.vercel.app:
# that instance is paused (503 DEPLOYMENT_PAUSED, 2026-09-05) and the project
# itself is deprecated in favour of this action, which runs the same renderer.
#
# Private-repo counts: add a repository secret STATS_TOKEN (classic PAT with
# `repo` + `read:user`) and the next run picks it up; without it the default
# GITHUB_TOKEN renders public data only.
name: Stats cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=chalawdotcom&show_icons=true&hide_border=true&theme=default&title_color=5047eb&icon_color=5047eb&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=chalawdotcom&layout=compact&hide_border=true&title_color=5047eb
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && echo "cards unchanged" && exit 0
          git commit -m "chore: refresh the stats cards"
          git push
